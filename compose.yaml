name: atlasflow-youtube
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlasflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      CDC_PASSWORD: ${CDC_PASSWORD:?Set CDC_PASSWORD in .env}
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: atlasflow-lite-kafka
    restart: unless-stopped
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    hostname: connect
    container_name: atlasflow-lite-connect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
    - 127.0.0.1:8083:8083
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: atlasflow-connect-cluster
      CONFIG_STORAGE_TOPIC: atlasflow.connect.configs
      OFFSET_STORAGE_TOPIC: atlasflow.connect.offsets
      STATUS_STORAGE_TOPIC: atlasflow.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      REST_HOST_NAME: 0.0.0.0
      REST_ADVERTISED_HOST_NAME: connect
      REST_PORT: 8083
      KAFKA_HEAP_OPTS: -Xms512M -Xmx1G
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  object-store:
    image: rustfs/rustfs:1.0.0
    hostname: object-store
    container_name: atlasflow-lite-object-store
    restart: unless-stopped
    ports:
    - 127.0.0.1:9000:9000
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_OBS_LOG_STDOUT_ENABLED: 'true'
    volumes:
    - rustfs_data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:9000/health/ready
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  create-warehouse-bucket:
    image: rustfs/rustfs:1.0.0
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    entrypoint:
    - /bin/sh
    command:
    - -c
    - curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}" --head http://object-store:9000/warehouse
      || curl -sSf --aws-sigv4 aws:amz:us-east-1:s3 --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}" -X PUT http://object-store:9000/warehouse
    networks:
    - atlasflow
    restart: 'no'
  iceberg-rest:
    image: apache/iceberg-rest-fixture@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
    hostname: iceberg-rest
    container_name: atlasflow-lite-iceberg-rest
    restart: unless-stopped
    depends_on:
      create-warehouse-bucket:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:18181:8181
    environment:
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/tmp/iceberg_catalog.db?journal_mode=WAL
      CATALOG_JDBC_USER: atlasflow_catalog
      CATALOG_JDBC_PASSWORD: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      CATALOG_JDBC_STRICT__MODE: 'true'
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      CATALOG_S3_ACCESS__KEY__ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      CATALOG_S3_SECRET__ACCESS__KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
    - iceberg_catalog_data:/tmp
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8181/v1/config
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  flink-volume-init:
    image: busybox:1.37
    container_name: atlasflow-lite-flink-volume-init
    user: "0:0"
    command:
    - sh
    - -ec
    - |
      mkdir -p /checkpoints /savepoints
      chown -R 9999:0 /checkpoints /savepoints
      chmod -R ug+rwX /checkpoints /savepoints
    volumes:
    - flink_checkpoints:/checkpoints
    - flink_savepoints:/savepoints
    restart: 'no'
  flink-jobmanager:
    image: atlasflow-flink-iceberg-kafka:2.2.0-1.12.0-kafka5.0
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
    hostname: flink-jobmanager
    container_name: atlasflow-lite-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    depends_on:
      iceberg-rest:
        condition: service_healthy
      flink-volume-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8081:8081
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager

        parallelism.default: 1

        execution.checkpointing.interval: 10s

        state.checkpoints.dir: file:///opt/flink/checkpoints

        state.savepoints.dir: file:///opt/flink/savepoints

        '
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
    - flink_checkpoints:/opt/flink/checkpoints
    - flink_savepoints:/opt/flink/savepoints
    - ./runtime/bronze:/opt/atlasflow/runtime/bronze:ro
    - ./runtime/silver:/opt/atlasflow/runtime/silver
    - ./runtime/gold:/opt/atlasflow/runtime/gold
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8081/overview >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  flink-taskmanager:
    image: atlasflow-flink-iceberg-kafka:2.2.0-1.12.0-kafka5.0
    hostname: flink-taskmanager
    container_name: atlasflow-lite-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: 'jobmanager.rpc.address: flink-jobmanager

        taskmanager.numberOfTaskSlots: 8

        parallelism.default: 1

        execution.checkpointing.interval: 10s

        state.checkpoints.dir: file:///opt/flink/checkpoints

        state.savepoints.dir: file:///opt/flink/savepoints

        '
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
    - flink_checkpoints:/opt/flink/checkpoints
    - flink_savepoints:/opt/flink/savepoints
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
  trino:
    image: trinodb/trino:484
    hostname: trino
    container_name: atlasflow-lite-trino
    restart: unless-stopped
    depends_on:
      iceberg-rest:
        condition: service_healthy
      object-store:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    volumes:
    - ./infra/trino/catalog/atlasflow.properties:/etc/trino/catalog/atlasflow.properties:ro
    - ./sql/atlasflow_queries.sql:/opt/atlasflow/atlasflow_queries.sql:ro
    ports:
    - 127.0.0.1:18080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  superset-db:
    image: postgres:16-bookworm
    hostname: superset-db
    container_name: atlasflow-lite-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:?Add SUPERSET_DB_PASSWORD to .env}
      POSTGRES_DB: superset
    volumes:
    - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U superset -d superset
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
  superset-init:
    image: atlasflow-superset:6.1.0
    build:
      context: ./infra/superset
      dockerfile: Dockerfile
    container_name: atlasflow-lite-superset-init
    restart: 'no'
    depends_on:
      superset-db:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/atlasflow/superset_config.py
      SUPERSET_HOME: /app/superset_home
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Add SUPERSET_SECRET_KEY to .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?Add SUPERSET_DB_PASSWORD to .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-atlasadmin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Add SUPERSET_ADMIN_PASSWORD to .env}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-atlasadmin@local.test}
      SUPERSET_LOAD_EXAMPLES: 'false'
    volumes:
    - superset_home:/app/superset_home
    entrypoint:
    - /bin/sh
    - -c
    command:
    - superset db upgrade && superset init && python /app/atlasflow/init_superset_admin.py
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
  superset:
    image: atlasflow-superset:6.1.0
    hostname: superset
    container_name: atlasflow-lite-superset
    restart: unless-stopped
    depends_on:
      superset-db:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/atlasflow/superset_config.py
      SUPERSET_HOME: /app/superset_home
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Add SUPERSET_SECRET_KEY to .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?Add SUPERSET_DB_PASSWORD to .env}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-atlasadmin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Add SUPERSET_ADMIN_PASSWORD to .env}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-atlasadmin@local.test}
      SUPERSET_LOAD_EXAMPLES: 'false'
    volumes:
    - superset_home:/app/superset_home
    ports:
    - 127.0.0.1:8088:8088
    entrypoint:
    - /bin/sh
    - -c
    command:
    - exec gunicorn --bind 0.0.0.0:8088 --workers 2 --worker-class gthread --threads 4 --timeout 120 'superset.app:create_app()'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5).read()
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  prometheus:
    image: prom/prometheus:v3.15.1
    hostname: prometheus
    container_name: atlasflow-lite-prometheus
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --storage.tsdb.retention.size=2GB
    - --web.enable-lifecycle
    volumes:
    - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O - http://127.0.0.1:9090/-/healthy >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    hostname: blackbox-exporter
    container_name: atlasflow-lite-blackbox-exporter
    restart: unless-stopped
    command:
    - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
    - ./infra/observability/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    expose:
    - '9115'
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 15s
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    hostname: kafka-exporter
    container_name: atlasflow-lite-kafka-exporter
    restart: unless-stopped
    command:
    - --kafka.server=kafka:19092
    - --web.listen-address=:9308
    - --log.level=info
    depends_on:
      kafka:
        condition: service_healthy
    expose:
    - '9308'
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 15s
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    hostname: cadvisor
    container_name: atlasflow-lite-cadvisor
    restart: unless-stopped
    command:
    - --docker_only=true
    - --store_container_labels=false
    - --housekeeping_interval=30s
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    expose:
    - '8080'
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 15s
  grafana:
    image: grafana/grafana:13.2.4
    hostname: grafana
    container_name: atlasflow-lite-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-atlasadmin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add GRAFANA_ADMIN_PASSWORD to .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 30s
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    hostname: kafka-ui
    container_name: atlasflow-lite-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: 'false'
      KAFKA_CLUSTERS_0_NAME: atlasflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: 'false'
    ports:
    - 127.0.0.1:8090:8080
    networks:
    - atlasflow
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 20s
networks:
  atlasflow:
    name: atlasflow-lite-network
volumes:
  postgres_data:
    name: atlasflow-lite-postgres-data
  rustfs_data:
    name: atlasflow-lite-rustfs-data
  iceberg_catalog_data:
    name: atlasflow-lite-iceberg-catalog-data
  flink_checkpoints:
    name: atlasflow-lite-flink-checkpoints
  flink_savepoints:
    name: atlasflow-lite-flink-savepoints
  superset_db_data:
    name: atlasflow-lite-superset-db-data
  superset_home:
    name: atlasflow-lite-superset-home
  prometheus_data:
    name: atlasflow-lite-prometheus-data
  grafana_data:
    name: atlasflow-lite-grafana-data
